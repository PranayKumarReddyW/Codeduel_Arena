server.port=${PORT:8088}

# Spring Application Name
spring.application.name=codeduel-backend

# Database Configuration (Defaults to persistent H2 file, or configurable for AWS RDS Postgres / MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:${DATA_DIR:./data}/codedueldb;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# Judge0 API Configuration (Configured for self-hosted instance on 54.196.209.169)
# Default self-hosted port is 2358. Can be overridden via JUDGE0_API_URL or .env
judge0.api.url=${JUDGE0_API_URL:http://54.196.209.169:2358}
judge0.api.key=${JUDGE0_API_KEY:}
judge0.api.host=${JUDGE0_API_HOST:}
judge0.api.wait=${JUDGE0_API_WAIT:true}

# Logging
logging.level.com.codeduel=INFO
logging.level.org.springframework.web=INFO
